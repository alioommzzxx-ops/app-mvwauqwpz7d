<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f7f4">
    <script>
      try{
        var _t=localStorage.getItem("mb2t");
        if(_t!=="dark"&&_t!=="light")_t="light";
        document.documentElement.setAttribute("data-theme",_t);
        document.querySelector('meta[name=theme-color]').setAttribute("content",_t=="dark"?"#06130d":"#f3f7f4")
      } catch(e) {
        document.documentElement.setAttribute("data-theme","light")
      }
    </script>
    <title>وكيل الغذاء</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
    <style>
      :root {
        --bg:#06130d;
        --bg2:#091a12;
        --card:#0d2018;
        --card2:#10291e;
        --tx:#e9f6ee;
        --mu:#8fb09f;
        --pr:#22c55e;
        --prt:#03160a;
        --bd:#1a3a2a;
        --dg:var(--dg);
        --ac:#12301f;
        --gd:#f5a524;
        --bl:#3b82f6;
        --pu:#8b5cf6;
        --sh:0 6px 24px rgba(0,0,0,.35);
        color-scheme:dark;
        --in:#08170f;
        --in2:#071510;
        --nvt:#c6e2d2;
        --hv:rgba(255,255,255,.06);
        --hb:1.15;
        --av3:#173a28;
        --pg:linear-gradient(135deg,#34d86f,#13954a);
        --pg2:linear-gradient(135deg,#34d86f,#0f7a3b);
        --topbg:linear-gradient(135deg,#0f4a2d,#0b2b1c);
        --lcbg:rgba(9,28,20,.78);
        --g1:rgba(255,255,255,.03);
        --g2:rgba(255,255,255,.035);
        --bodyg:radial-gradient(900px 500px at 85% -10%,#0e3a25 0,transparent 60%),var(--bg);
        --lgbg:radial-gradient(700px 420px at 90% 8%,#0f4a2d 0,transparent 60%),radial-gradient(600px 500px at 0% 85%,#13301f 0,transparent 60%),#04100a;
        box-sizing:border-box;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px)
      }
      html {
        scroll-padding-top:env(safe-area-inset-top,0px);
        overflow-x:hidden
      }
      :root[data-theme=light] {
        --bg:#f3f7f4;
        --bg2:#ffffff;
        --card:#ffffff;
        --card2:#ffffff;
        --tx:#10261a;
        --mu:#5b7566;
        --pr:#15803d;
        --prt:#ffffff;
        --bd:#d3e3d9;
        --dg:#dc2626;
        --ac:#e4f4e9;
        --gd:#b45309;
        --bl:#2563eb;
        --pu:#7c3aed;
        --sh:0 4px 16px rgba(16,38,26,.08);
        color-scheme:light;
        --in:#f3f8f5;
        --in2:#f1f7f3;
        --nvt:#2f4a3a;
        --hv:rgba(16,38,26,.06);
        --hb:.96;
        --av3:#dcefe3;
        --pg:linear-gradient(135deg,#22a653,#15803d);
        --pg2:linear-gradient(135deg,#22a653,#166534);
        --topbg:linear-gradient(135deg,#dcfce7,#f0fdf4);
        --lcbg:rgba(255,255,255,.88);
        --g1:rgba(16,38,26,.04);
        --g2:rgba(16,38,26,.05);
        --bodyg:radial-gradient(900px 500px at 85% -10%,#d9f3e2 0,transparent 60%),var(--bg);
        --lgbg:radial-gradient(700px 420px at 90% 8%,#d2f0dc 0,transparent 60%),radial-gradient(600px 500px at 0% 85%,#e3f3e9 0,transparent 60%),#f3f7f4
      }
      :root[data-theme=light] .s0 {
        color:#b45309
      }
      :root[data-theme=light] .s1 {
        color:#1d4ed8
      }
      :root[data-theme=light] .s2 {
        color:#15803d
      }
      * {
        box-sizing:border-box
      }
      body {
        margin:0;
        color:var(--tx);
        font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;
        line-height:1.6;
        background:var(--bodyg)
      }
      button {
        font:inherit;
        cursor:pointer;
        border:1px solid var(--bd);
        background:var(--card2);
        color:var(--tx);
        border-radius:12px;
        padding:8px 14px;
        transition:.15s
      }
      button {
        -webkit-tap-highlight-color:transparent;
        touch-action:manipulation;
        min-height:40px
      }
      @media(hover:hover) {
        button:hover {
          filter:brightness(var(--hb))
        }
      }
      button:active {
        transform:scale(.97);
        filter:brightness(.92)
      }
      button:focus-visible {
        outline:2px solid var(--pr);
        outline-offset:2px
      }
      button:disabled {
        opacity:.5;
        cursor:not-allowed;
        transform:none
      }
      button[data-a=cp] {
        min-height:30px;
        padding:2px 12px
      }
      @media(pointer:coarse) {
        button {
          min-height:44px
        }
        .chip {
          min-height:38px
        }
        button[data-a=cp] {
          min-height:36px
        }
      }
      button.p {
        background:var(--pg);
        color:var(--prt);
        border:0;
        font-weight:800
      }
      button.d {
        color:var(--dg);
        border-color:rgba(220,38,38,.35)
      }
      @media(hover:hover) {
        button.d:hover {
          background:rgba(220,38,38,.1)
        }
      }
      input,select {
        font:inherit;
        width:100%;
        padding:9px 11px;
        border:1px solid var(--bd);
        border-radius:12px;
        background:var(--in);
        color:var(--tx)
      }
      input:focus,select:focus {
        outline:2px solid rgba(34,197,94,.45)
      }
      label {
        display:block;
        font-size:.78rem;
        color:var(--mu);
        margin:8px 0 3px
      }
      h3 {
        margin:0 0 12px;
        font-size:1.02rem
      }
      .wrap {
        max-width:900px;
        margin:0 auto;
        padding:14px
      }
      .card {
        background:linear-gradient(180deg,var(--card2),var(--card));
        border:1px solid var(--bd);
        border-radius:18px;
        padding:16px;
        box-shadow:var(--sh)
      }
      .grid {
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
        gap:12px;
        margin-bottom:14px
      }
      .dob {
        display:grid;
        grid-template-columns:1fr 1fr 1.5fr;
        gap:8px
      }
      .dob input {
        text-align:center
      }
      .two {
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px
      }
      .two2 {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
        gap:12px;
        margin-bottom:12px
      }
      .cols {
        display:grid;
        grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
        gap:12px;
        margin-bottom:12px
      }
      .cols>*,.two2>*,.grid>* {
        min-width:0
      }
      @media(max-width:900px) {
        .cols {
          grid-template-columns:minmax(0,1fr)
        }
      }
      .mu {
        color:var(--mu);
        font-size:.85rem
      }
      .badge {
        display:inline-block;
        border-radius:20px;
        padding:2px 12px;
        font-size:.78rem;
        font-weight:700;
        background:var(--ac);
        color:var(--pr)
      }
      .s0 {
        background:rgba(245,165,36,.15);
        color:#f5a524
      }
      .s1 {
        background:rgba(59,130,246,.18);
        color:#6aa5ff
      }
      .s2 {
        background:rgba(34,197,94,.17);
        color:#34d86f
      }
      .id {
        display:inline-block;
        background:rgba(34,197,94,.15);
        color:var(--pr);
        font-weight:800;
        border-radius:10px;
        padding:2px 10px;
        font-size:.85rem
      }
      .nm {
        font-weight:800;
        border:0;
        background:none;
        padding:4px 0;
        font-size:1.05rem
      }
      .tot {
        background:var(--ac);
        border-radius:12px;
        padding:10px;
        text-align:center;
        font-weight:800;
        margin-top:10px;
        color:var(--pr)
      }
      .cred {
        border:1px dashed var(--pr);
        border-radius:12px;
        padding:8px 10px;
        margin-top:8px;
        font-size:.88rem;
        background:var(--ac)
      }
      .cred b {
        direction:ltr;
        unicode-bidi:embed
      }
      .bar {
        display:flex;
        gap:8px;
        margin-bottom:14px;
        align-items:center;
        justify-content:space-between
      }
      .bar input {
        flex:1
      }
      .it {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:8px;
        padding:10px 12px;
        background:var(--in);
        border-radius:12px;
        margin-bottom:8px
      }
      .big {
        font-size:1.9rem;
        font-weight:800;
        color:var(--gd)
      }
      .ch {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:6px;
        margin-bottom:4px
      }
      .chips {
        display:flex;
        flex-wrap:wrap;
        gap:6px
      }
      .chip {
        border-radius:20px;
        padding:4px 12px;
        font-size:.82rem;
        background:var(--ac);
        color:var(--pr);
        border-color:transparent;
        white-space:normal;
        text-align:right
      }
      .chip.on {
        background:var(--pr);
        color:var(--prt);
        font-weight:800
      }
      .sec {
        font-size:.75rem;
        color:var(--mu);
        margin:12px 0 4px;
        font-weight:700;
        border-top:1px dashed var(--bd);
        padding-top:8px
      }
      .new {
        border:2px solid var(--pr);
        margin-bottom:14px
      }
      .hl {
        border-color:var(--pr);
        animation:pl 1.6s 2
      }
      @keyframes pl {
        50% {
          box-shadow:0 0 0 7px rgba(34,197,94,.3)
        }
      }
      /* login */
      .lg {
        min-height:100vh;
        display:grid;
        place-items:center;
        position:relative;
        overflow:hidden;
        padding:20px;
        background:var(--lgbg)
      }
      .lg::before {
        content:"";
        position:absolute;
        inset:0;
        background:repeating-linear-gradient(90deg,transparent 0 110px,var(--g1) 110px 114px),repeating-linear-gradient(0deg,transparent 0 80px,var(--g2) 80px 84px);
        -webkit-mask-image:linear-gradient(90deg,#000,transparent 55%);
        mask-image:linear-gradient(90deg,#000,transparent 55%)
      }
      .food {
        position:absolute;
        bottom:-6px;
        right:2%;
        font-size:4.4rem;
        opacity:.9;
        filter:drop-shadow(0 8px 18px rgba(0,0,0,.6));
        letter-spacing:.08em
      }
      .lw {
        position:relative;
        width:min(450px,100%);
        text-align:center
      }
      .lt h1 {
        margin:6px 0 0;
        font-size:2.2rem;
        font-weight:800
      }
      .lt p {
        margin:2px 0;
        color:var(--mu)
      }
      .ul {
        display:block;
        width:70px;
        height:3px;
        background:var(--pr);
        border-radius:3px;
        margin:12px auto 20px
      }
      .lc {
        background:var(--lcbg);
        -webkit-backdrop-filter:blur(8px);
        backdrop-filter:blur(8px);
        border:1px solid rgba(34,197,94,.35);
        border-radius:26px;
        padding:28px;
        text-align:right
      }
      .lc h2 {
        margin:0;
        text-align:center;
        font-size:1.6rem
      }
      .lc>p {
        text-align:center;
        margin:4px 0 18px
      }
      .inp {
        display:flex;
        align-items:center;
        gap:8px;
        background:var(--in2);
        border:1px solid var(--bd);
        border-radius:16px;
        padding:0 14px;
        margin-bottom:12px
      }
      .inp input {
        border:0;
        background:none;
        outline:0;
        padding:14px 0;
        text-align:right
      }
      .inp button {
        border:0;
        background:none;
        padding:4px
      }
      .lb {
        width:100%;
        padding:14px;
        font-size:1.1rem;
        border-radius:16px;
        margin-top:4px
      }
      .er {
        color:var(--dg);
        min-height:22px;
        font-size:.88rem;
        text-align:center
      }
      .lf {
        display:flex;
        align-items:center;
        gap:10px;
        justify-content:center;
        margin-top:22px
      }
      .lf i {
        width:50px;
        height:1px;
        background:var(--pr)
      }
      .shake {
        animation:sk .4s
      }
      @keyframes sk {
        25% {
          transform:translateX(-8px)
        }
        75% {
          transform:translateX(8px)
        }
      }
      @media(max-width:700px) {
        .food {
          font-size:2.4rem;
          opacity:.5
        }
      }
      /* admin shell */
      .app {
        display:grid;
        grid-template-columns:240px minmax(0,1fr);
        min-height:100vh
      }
      .app>.side {
        grid-column:1;
        grid-row:1
      }
      .app>.main {
        grid-column:2;
        grid-row:1
      }
      .side {
        position:sticky;
        top:0;
        height:100vh;
        background:var(--bg2);
        border-left:1px solid var(--bd);
        padding:16px 12px;
        display:flex;
        flex-direction:column;
        gap:6px
      }
      .brand {
        display:flex;
        gap:10px;
        align-items:center;
        padding:4px 6px 16px;
        border-bottom:1px solid var(--bd);
        margin-bottom:8px
      }
      .brand b {
        display:block;
        font-size:1.1rem
      }
      .brand small {
        color:var(--mu);
        font-size:.7rem
      }
      .side nav {
        display:flex;
        flex-direction:column;
        gap:4px;
        flex:1;
        min-width:0
      }
      .nv {
        display:flex;
        align-items:center;
        gap:10px;
        width:100%;
        border:0;
        background:none;
        color:var(--nvt);
        padding:11px 12px;
        border-radius:12px;
        text-align:right;
        font-weight:500
      }
      .nv:hover {
        background:var(--hv)
      }
      .nv.on {
        background:var(--pg);
        color:var(--prt);
        font-weight:800
      }
      .nv i {
        font-style:normal;
        font-size:1.15rem
      }
      .cnt {
        margin-inline-start:auto;
        font-style:normal;
        background:var(--bl);
        color:#fff;
        border-radius:20px;
        font-size:.72rem;
        padding:0 8px;
        font-weight:700
      }
      .sf {
        display:flex;
        align-items:center;
        gap:8px;
        justify-content:center;
        color:var(--mu);
        font-size:.8rem;
        padding-top:12px;
        border-top:1px solid var(--bd)
      }
      .main {
        padding:16px 18px;
        min-width:0
      }
      .main>* {
        animation:fi .3s
      }
      @keyframes fi {
        from {
          opacity:0;
          transform:translateY(8px)
        }
      }
      .tb {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:8px;
        background:var(--bg2);
        border:1px solid var(--bd);
        border-radius:18px;
        padding:10px 14px;
        margin-bottom:14px
      }
      .adm {
        display:flex;
        gap:10px;
        align-items:center
      }
      .adm small {
        display:block;
        color:var(--mu);
        font-size:.72rem;
        line-height:1.2
      }
      .av2 {
        width:40px;
        height:40px;
        border-radius:50%;
        background:var(--pg2);
        color:var(--prt);
        display:grid;
        place-items:center;
        font-weight:800
      }
      .act {
        display:flex;
        gap:8px;
        align-items:center
      }
      .ib {
        width:44px;
        height:44px;
        min-height:0!important;
        padding:0;
        border-radius:50%;
        display:inline-grid;
        place-items:center;
        font-size:1.05rem;
        flex:none
      }
      .thf {
        position:absolute;
        top:14px;
        left:14px;
        z-index:2
      }
      .mh {
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:12px
      }
      .mh h2 {
        margin:0;
        font-size:1.3rem
      }
      @media(max-width:800px) {
        .app {
          display:block
        }
        .side {
          position:fixed;
          bottom:0;
          left:0;
          right:0;
          top:auto;
          height:auto;
          flex-direction:row;
          padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
          z-index:20;
          border-radius:18px 18px 0 0;
          border-top:1px solid var(--bd);
          border-left:0;
          width:100%;
          max-width:100vw;
          overflow:hidden
        }
        .app>.side,.app>.main {
          grid-column:auto;
          grid-row:auto
        }
        .brand,.sf {
          display:none
        }
        .side nav {
          flex-direction:row;
          gap:0;
          overflow-x:auto
        }
        .nv {
          flex-direction:column;
          gap:0;
          padding:6px 8px;
          font-size:.62rem;
          text-align:center;
          min-width:64px;
          justify-content:center;
          position:relative
        }
        .cnt {
          position:absolute;
          top:0;
          left:10px;
          margin:0
        }
        .main {
          padding-bottom:100px
        }
        .tb .badge {
          display:none
        }
      }
      /* dashboard */
      .stats {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:12px;
        margin-bottom:12px
      }
      .st {
        display:flex;
        gap:12px;
        align-items:center;
        background:linear-gradient(180deg,var(--card2),var(--card));
        border:1px solid var(--bd);
        border-radius:18px;
        padding:14px;
        box-shadow:var(--sh)
      }
      .st i {
        font-style:normal;
        width:48px;
        height:48px;
        border-radius:14px;
        display:grid;
        place-items:center;
        font-size:1.4rem;
        flex:none
      }
      .st:nth-child(1) i {
        background:#16a34a
      }
      .st:nth-child(2) i {
        background:#2563eb
      }
      .st:nth-child(3) i {
        background:#d97706
      }
      .st:nth-child(4) i {
        background:#7c3aed
      }
      .st span {
        display:block;
        font-size:.78rem;
        color:var(--mu)
      }
      .st b {
        display:block;
        font-size:1.6rem;
        line-height:1.2
      }
      .st small {
        color:var(--pr);
        font-size:.72rem
      }
      .pg {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
        gap:10px
      }
      .pc {
        background:var(--in);
        border:1px solid var(--bd);
        border-radius:14px;
        padding:12px;
        text-align:center
      }
      .pc .em {
        font-size:2.2rem
      }
      .pc b {
        display:block
      }
      .pc small {
        color:var(--mu)
      }
      .pc em {
        display:block;
        font-style:normal;
        color:var(--pr);
        font-weight:700;
        font-size:.85rem
      }
      .dw {
        display:flex;
        align-items:center;
        gap:18px;
        flex-wrap:wrap;
        justify-content:center
      }
      .dn {
        width:140px;
        height:140px;
        border-radius:50%;
        position:relative;
        flex:none
      }
      .dn::after {
        content:"";
        position:absolute;
        inset:28px;
        background:var(--card);
        border-radius:50%
      }
      .lg2 div {
        display:flex;
        align-items:center;
        gap:8px;
        margin:6px 0;
        font-size:.9rem
      }
      .lg2 i {
        width:10px;
        height:10px;
        border-radius:50%;
        display:inline-block
      }
      .lg2 b {
        margin-inline-start:auto
      }
      .or {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        flex-wrap:wrap;
        padding:12px 4px;
        border-bottom:1px solid var(--bd)
      }
      .or:last-child {
        border:0
      }
      .oi {
        display:flex;
        flex-direction:column;
        line-height:1.4
      }
      .om {
        display:flex;
        gap:8px;
        align-items:center;
        flex-wrap:wrap
      }
      .om select {
        width:auto
      }
      .ra {
        display:flex;
        align-items:center;
        gap:10px
      }
      .ra .av2 {
        width:36px;
        height:36px;
        font-size:.9rem;
        background:var(--av3);
        color:var(--mu)
      }
      .ra div {
        flex:1;
        line-height:1.3
      }
      .ra small {
        color:var(--mu)
      }
      table {
        width:100%;
        border-collapse:collapse;
        font-size:.88rem
      }
      th {
        color:var(--mu);
        font-weight:500
      }
      th,td {
        padding:8px 6px;
        text-align:right;
        border-bottom:1px solid var(--bd);
        white-space:nowrap
      }
      .scroll {
        overflow-x:auto

      async function startScan() {
        var v=document.getElementById("scanVideo");
        if(!v)return;
        if(!("BarcodeDetector" in window)) {
          alert("المتصفح لا يدعم مسح QR. أدخل رقم الأيدي يدوياً.");
          return
        }
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) {
          alert("الكاميرا تحتاج إلى اتصال آمن HTTPS.");
          return
        }
        try{
          var fm=await BarcodeDetector.getSupportedFormats(),formats=fm.indexOf("qr_code")>=0?["qr_code"]:fm;
          scanDetector=new BarcodeDetector({
            formats:formats
          });
          scanStream=await navigator.mediaDevices.getUserMedia({
            video:{
              facingMode:{
                ideal:"environment"
              }
            },audio:false
          });
          v.srcObject=scanStream;
          v.style.display="block";
          await v.play();
          var loop=async function() {
            if(!scanStream||!scanDetector)return;
            try{
              var codes=await scanDetector.detect(v);
              if(codes&&codes.length) {
                var raw=codes[0].rawValue,found=findPerson(raw);
                if(found) {
                  openScannedPerson(found);
                  return
                }
                var input=document.getElementById("scanInput");
                if(input)input.value=raw;
                showScanResult(null,raw);
                stopScan();
                return
              }
            } catch(e){}
            scanTimer=setTimeout(loop,250)
          };
          loop()
        } catch(e) {
          stopScan();
          alert("تعذّر تشغيل الكاميرا. امنح المتصفح الإذن أو استخدم البحث اليدوي.")
        }
      }
